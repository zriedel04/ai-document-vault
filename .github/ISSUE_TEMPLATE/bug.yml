name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste personal documents, document text, API keys or local paths.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python version, browser
