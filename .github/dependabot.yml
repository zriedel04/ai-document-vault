version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 does not install next to openapi-typescript (peer range ^5.x) and
      # typescript-eslint, so the whole npm group fails to resolve. Bump it by hand when both
      # support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The build backend is pinned to the minor series the owner has tested
      # (backend/pyproject.toml); bump it by hand together with the uv version.
      - dependency-name: uv-build
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /demo/generate
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
