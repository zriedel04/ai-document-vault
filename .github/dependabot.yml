version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 does not install next to openapi-typescript (peer range ^5.x) and
      # typescript-eslint, so the whole npm group fails to resolve. Bump it by hand when both
      # support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows Node.js releases. It stays on the oldest release the frontend
      # supports (engines.node, now 22.13), or the type check accepts APIs that release lacks;
      # patch updates still come. scripts/tests/test_node_types.py checks they agree. Move the
      # types together with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The build backend is pinned to the minor series the owner has tested
      # (backend/pyproject.toml); bump it by hand together with the uv version.
      - dependency-name: uv-build
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /demo/generate
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
