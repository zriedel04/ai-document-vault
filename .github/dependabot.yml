version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 does not install next to openapi-typescript (peer range ^5.x) and
      # typescript-eslint, so the whole npm group fails to resolve. Bump it by hand when both
      # support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node describes one Node.js major. It stays on the oldest major the frontend
      # supports (engines.node, and what CI runs), or the type check accepts APIs that version
      # lacks. scripts/tests/test_node_types.py checks the three agree. Move it with them.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # The build backend is pinned to the minor series the owner has tested
      # (backend/pyproject.toml); bump it by hand together with the uv version.
      - dependency-name: uv-build
    commit-message:
      prefix: build
  - package-ecosystem: uv
    directory: /demo/generate
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
