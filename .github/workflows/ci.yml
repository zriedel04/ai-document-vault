name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.8.17
  PIP_AUDIT_VERSION: 2.10.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  repo-safety:
    name: Repository safety (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Safety check on tracked files and full history
        run: python scripts/check_repo_safety.py --history
      - name: ADR structure check
        run: python scripts/check_adrs.py
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--all"
      - name: Hygiene hooks
        env:
          SKIP: gitleaks
        run: |
          python -m pip install pre-commit==4.6.2
          pre-commit run --all-files --show-diff-on-failure

  repo-safety-windows:
    name: Repository safety (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_repo_safety.py --history

  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Install from the lock file
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Licence check (development tools included, reviewed exceptions allowed)
        run: uv run python ../scripts/check_python_licenses.py --ignore vault
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file ../runtime.txt
          uv export --locked --only-dev --no-hashes --output-file ../dev.txt
          pip-audit --requirement ../runtime.txt --no-deps --disable-pip --strict
          pip-audit --requirement ../dev.txt --no-deps --disable-pip --strict
      - name: Licence check (runtime only, no exceptions)
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python ../scripts/check_python_licenses.py --strict --ignore vault

  backend-windows:
    name: Backend (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==$env:UV_VERSION"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    name: Frontend (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Install frontend dependencies from the lock file
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier
        working-directory: frontend
        run: npm run format:check
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Type check and build
        working-directory: frontend
        run: npm run build
      - name: API client is current with the backend schema
        run: |
          cd backend
          uv sync --locked
          uv run python -m vault.openapi ../frontend/openapi.json
          cd ../frontend
          npm run api:generate
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - name: Licence check (development tools included, reviewed exceptions allowed)
        run: python scripts/check_npm_licenses.py
      - name: Licence check (runtime only, no exceptions)
        run: python scripts/check_npm_licenses.py --strict
      - name: Dependency audit
        working-directory: frontend
        run: npm audit
      - name: Backend serves the built frontend
        run: |
          cd backend
          AIVAULT_SERVER__PORT=18765 uv run python -m vault &
          cd ..
          python scripts/smoke_test_server.py http://127.0.0.1:18765

  frontend-windows:
    name: Frontend (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  demo-corpus:
    name: Demo corpus (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Install from the lock file
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Validation tests (every cited document, page and quote exists)
        run: uv run python -m unittest discover -s tests -v
      - name: Committed corpus and eval set match the generator
        run: uv run python build.py --check
      - name: Licence check (generator tools, reviewed exceptions allowed)
        run: uv run python ../../scripts/check_python_licenses.py --ignore demo-generate
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file ../../runtime.txt
          uv export --locked --only-dev --no-hashes --output-file ../../dev.txt
          pip-audit --requirement ../../runtime.txt --no-deps --disable-pip --strict
          pip-audit --requirement ../../dev.txt --no-deps --disable-pip --strict

  demo-corpus-windows:
    name: Demo corpus (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo/generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==$env:UV_VERSION"
      - run: uv sync --locked
      # Byte-for-byte comparison with the committed files is Linux-only (libraries can differ in
      # their compression); here the tests check that the corpus is valid and deterministic.
      - run: uv run python -m unittest discover -s tests -v

  launcher-windows:
    name: Launcher (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install "uv==$env:UV_VERSION"

      - name: Tests, in Windows PowerShell 5.1 and in PowerShell 7
        shell: pwsh
        run: |
          foreach ($edition in 'powershell', 'pwsh') {
            Write-Host "== $edition"
            & $edition -NoProfile -File .\scripts\tests\launcher.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw "the launcher tests failed in $edition" }
          }
      - name: Install
        shell: pwsh
        run: |
          .\vault.ps1 install
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
      - name: Settings for a throwaway vault outside the repository
        shell: pwsh
        run: |
          # An accented letter in the folder name: the record of the running server must keep it.
          $vault = Join-Path $env:RUNNER_TEMP ('vault-Jos' + [char]0x00E9)
          $config = Join-Path $env:RUNNER_TEMP 'config.toml'
          # PowerShell 7's utf8 has no byte order mark, which the TOML reader would refuse.
          Set-Content -LiteralPath $config -Encoding utf8 -Value @("[vault]", "path = '$vault'", "[server]", "port = 18766")
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'no-vault.toml') -Encoding utf8 -Value @("[server]", "port = 18766")
          # dev needs the address the Vite proxy is fixed to, the default 127.0.0.1:8765.
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'dev.toml') -Encoding utf8 -Value @("[vault]", "path = '$vault'")
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'other-port.toml') -Encoding utf8 -Value @("[vault]", "path = '$vault'", "[server]", "port = 18767")
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'ipv6.toml') -Encoding utf8 -Value @("[vault]", "path = '$vault'", "[server]", 'host = "::1"')
          "AIVAULT_CONFIG=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run, serve the app and stop, in both PowerShell editions
        shell: pwsh
        run: |
          $vault = Join-Path $env:RUNNER_TEMP ('vault-Jos' + [char]0x00E9)
          foreach ($edition in 'powershell', 'pwsh') {
            Write-Host "== $edition"
            & $edition -NoProfile -File .\vault.ps1 run -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "run failed in $edition" }
            if (-not (Test-Path -LiteralPath (Join-Path $vault 'local-token'))) { throw 'the server did not create the token file' }
            python scripts/smoke_test_server.py http://127.0.0.1:18766
            if ($LASTEXITCODE -ne 0) { throw 'the server did not serve the app' }
            # The second run reads the vault folder back from the record, so a folder name that
            # the record had mangled would fail here ("the token file local-token is not in...").
            # The other edition reads the record the first one wrote.
            $otherEdition = if ($edition -eq 'pwsh') { 'powershell' } else { 'pwsh' }
            foreach ($again in $edition, $otherEdition) {
              $text = & $again -NoProfile -File .\vault.ps1 run -NoBrowser | Out-String
              if ($LASTEXITCODE -ne 0) { throw "a second run in $again failed: $text" }
              if ($text -notmatch 'already running') { throw "a second run in $again did not notice the first: $text" }
            }
            # Changed settings must not redirect a second run to a port nothing listens on.
            $kept = $env:AIVAULT_CONFIG
            $env:AIVAULT_CONFIG = Join-Path $env:RUNNER_TEMP 'other-port.toml'
            $changed = & $edition -NoProfile -File .\vault.ps1 run -NoBrowser | Out-String
            $env:AIVAULT_CONFIG = $kept
            if (($changed -notmatch 'settings have changed') -or ($changed -notmatch ':18766/') -or ($changed -match '18767')) { throw "a second run with other settings did not keep to the running server: $changed" }
            & $edition -NoProfile -File .\vault.ps1 stop
            if ($LASTEXITCODE -ne 0) { throw "stop failed in $edition" }
            if (Test-Path .run\server.json) { throw 'stop left its record behind' }
            $up = $true
            try { Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:18766/api/health -TimeoutSec 2 | Out-Null } catch { $up = $false }
            if ($up) { throw 'the server still answers after stop' }
            $idle = & $edition -NoProfile -File .\vault.ps1 stop | Out-String
            if ($idle -notmatch 'not running') { throw 'stop did not say the server was not running' }
          }
      - name: check passes the vault, beside the running server too, and fails a damaged one
        shell: pwsh
        run: |
          $vault = Join-Path $env:RUNNER_TEMP ('vault-Jos' + [char]0x00E9)
          foreach ($edition in 'powershell', 'pwsh') {
            $text = & $edition -NoProfile -File .\vault.ps1 check 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "check failed on a sound vault in ${edition}: $text" }
            if ($text -notmatch 'No problems found') { throw "unexpected report in ${edition}: $text" }
          }
          # Reads under WAL do not block the server, nor the server them.
          & powershell -NoProfile -File .\vault.ps1 run -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'run failed' }
          try {
            $text = & pwsh -NoProfile -File .\vault.ps1 check 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "check failed beside the running server: $text" }
          }
          finally {
            & powershell -NoProfile -File .\vault.ps1 stop
          }
          if ($LASTEXITCODE -ne 0) { throw 'stop failed' }
          $stray = Join-Path $vault 'blobs\sha256\Patient-Notes.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $stray) | Out-Null
          Set-Content -LiteralPath $stray -Value 'synthetic' -Encoding ASCII
          try {
            foreach ($edition in 'powershell', 'pwsh') {
              $text = & $edition -NoProfile -File .\vault.ps1 check 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { throw "check passed a damaged vault in $edition" }
              if ($text -notmatch 'stray_other') { throw "the stray entry was not reported in ${edition}: $text" }
              if ($text -match 'Patient') { throw "the report named a file in ${edition}: $text" }
            }
            if (-not (Test-Path -LiteralPath $stray)) { throw 'check removed the stray entry' }
          }
          finally {
            Remove-Item -LiteralPath $stray -Force
          }
          exit 0
      - name: Backup while the server runs, in both PowerShell editions
        shell: pwsh
        run: |
          # A space, an accented letter and a trailing backslash: the folder must reach the backend
          # intact (it goes in an environment variable) and must never be printed.
          $name = 'Backups Jos' + [char]0x00E9
          $target = Join-Path $env:RUNNER_TEMP $name
          & powershell -NoProfile -File .\vault.ps1 run -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'run failed' }
          try {
            foreach ($edition in 'powershell', 'pwsh') {
              Write-Host "== $edition"
              $text = & $edition -NoProfile -File .\vault.ps1 backup -To ($target + '\') 2>&1 | Out-String
              Write-Host $text
              if ($LASTEXITCODE -ne 0) { throw "backup failed in $edition" }
              if ($text -notmatch 'Snapshot \d{4}-\d{2}-\d{2}T\d{6}Z written') { throw "backup in $edition did not report its snapshot" }
              if ($text.Contains($name) -or $text.Contains('Backups Jos')) { throw "backup in $edition printed the folder" }
              Start-Sleep -Seconds 2   # one snapshot per second at most
            }
            $snapshots = @(Get-ChildItem -LiteralPath (Join-Path $target 'snapshots') -Directory)
            if ($snapshots.Count -ne 2) { throw "expected two snapshots, found $($snapshots.Count)" }
            foreach ($snapshot in $snapshots) {
              if (-not (Test-Path -LiteralPath (Join-Path $snapshot.FullName 'vault.db') -PathType Leaf)) { throw 'a snapshot has no vault.db' }
            }
            $vault = Join-Path $env:RUNNER_TEMP ('vault-Jos' + [char]0x00E9)
            $inside = & pwsh -NoProfile -File .\vault.ps1 backup -To (Join-Path $vault 'backup') 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -or $inside -notmatch 'inside the vault folder') { throw "a backup into the vault folder was not refused: $inside" }
          }
          finally {
            & powershell -NoProfile -File .\vault.ps1 stop
          }
      - name: run refuses a port that something else holds
        shell: pwsh
        run: |
          # Another program (or another copy of the app) on the port: the new server would fail
          # to bind, yet it could be taken for ready because the other one answers.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18766)
          $listener.Start()
          try {
            foreach ($edition in 'powershell', 'pwsh') {
              $text = & $edition -NoProfile -File .\vault.ps1 run -NoBrowser 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { throw "run started in $edition although the port was taken" }
              if ($text -notmatch 'already answers') { throw "unexpected message in ${edition}: $text" }
              if (Test-Path .run\server.json) { throw 'a record was left behind' }
            }
          }
          finally { $listener.Stop() }
          # The refused runs left exit code 1 behind, and the step would report it.
          exit 0
      - name: Two runs started together leave one server that stop can find
        shell: pwsh
        run: |
          foreach ($edition in 'powershell', 'pwsh') {
            Write-Host "== $edition"
            $processes = foreach ($i in 1, 2) {
              Start-Process -FilePath $edition -NoNewWindow -PassThru `
                -ArgumentList '-NoProfile', '-File', '.\vault.ps1', 'run', '-NoBrowser' `
                -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "race$i.out") `
                -RedirectStandardError (Join-Path $env:RUNNER_TEMP "race$i.err")
            }
            $null = $processes | ForEach-Object { $_.Handle }   # keeps the exit code readable
            $processes | Wait-Process -Timeout 240 -ErrorAction SilentlyContinue
            foreach ($p in $processes) {
              if (-not $p.HasExited) { $p.Kill(); throw "a run did not finish in $edition" }
            }
            foreach ($i in 1, 2) {
              $p = $processes[$i - 1]
              if ($p.ExitCode -ne 0) { throw "run $i failed in $edition (exit $($p.ExitCode)): $(Get-Content -Raw (Join-Path $env:RUNNER_TEMP "race$i.err")) $(Get-Content -Raw (Join-Path $env:RUNNER_TEMP "race$i.out"))" }
            }
            if (-not (Test-Path .run\server.json)) { throw 'no record of the server' }
            python scripts/smoke_test_server.py http://127.0.0.1:18766
            if ($LASTEXITCODE -ne 0) { throw 'the server did not serve the app' }
            & $edition -NoProfile -File .\vault.ps1 stop
            if ($LASTEXITCODE -ne 0) { throw "stop failed in $edition" }
            $up = $true
            try { Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:18766/api/health -TimeoutSec 2 | Out-Null } catch { $up = $false }
            if ($up) { throw 'a server was left running that stop could not find' }
          }
      - name: dev refuses a host the Vite proxy cannot reach
        shell: pwsh
        run: |
          $env:AIVAULT_CONFIG = Join-Path $env:RUNNER_TEMP 'ipv6.toml'
          $text = & powershell -NoProfile -File .\vault.ps1 dev -NoBrowser 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'dev started with an IPv6 host' }
          if ($text -notmatch 'dev expects server.host 127.0.0.1') { throw "unexpected message: $text" }
          if (Test-Path .run\server.json) { throw 'a server was started anyway' }
          exit 0
      - name: dev refuses a Vite port that something else holds
        shell: pwsh
        run: |
          $env:AIVAULT_CONFIG = Join-Path $env:RUNNER_TEMP 'dev.toml'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 5173)
          $listener.Start()
          try {
            foreach ($edition in 'powershell', 'pwsh') {
              $text = & $edition -NoProfile -File .\vault.ps1 dev -NoBrowser 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { throw "dev started in $edition although port 5173 was taken" }
              if ($text -notmatch 'already answers on 127.0.0.1:5173') { throw "unexpected message in ${edition}: $text" }
              if (Test-Path .run\server.json) { throw 'a server was started anyway' }
            }
          }
          finally { $listener.Stop() }
          exit 0
      - name: dev answers with its launch id, and leaves a newer server alone when it ends
        shell: pwsh
        run: |
          $env:AIVAULT_CONFIG = Join-Path $env:RUNNER_TEMP 'dev.toml'
          function Test-Answers([string]$Url) {
            try { Invoke-WebRequest -UseBasicParsing -Uri $Url -TimeoutSec 2 | Out-Null; return $true } catch { return $false }
          }
          function Start-Dev([string]$Edition) {
            $out = Join-Path $env:RUNNER_TEMP "dev-$Edition.out"
            $process = Start-Process -FilePath $Edition -NoNewWindow -PassThru `
              -ArgumentList '-NoProfile', '-File', '.\vault.ps1', 'dev', '-NoBrowser' `
              -RedirectStandardOutput $out -RedirectStandardError (Join-Path $env:RUNNER_TEMP "dev-$Edition.err")
            $null = $process.Handle
            $deadline = (Get-Date).AddMinutes(3)
            while (-not ((Test-Path $out) -and ((Get-Content -Raw $out) -match 'The dev server is at'))) {
              if ($process.HasExited) { throw "dev ended in ${Edition}: $(Get-Content -Raw $out) $(Get-Content -Raw (Join-Path $env:RUNNER_TEMP "dev-$Edition.err"))" }
              if ((Get-Date) -gt $deadline) { $process.Kill(); throw "dev did not start in $Edition" }
              Start-Sleep -Milliseconds 500
            }
            return $process
          }
          function Stop-Vite([System.Diagnostics.Process]$Dev, [string]$Edition) {
            # Vite ending (as on Ctrl+C) is what makes dev end the server.
            Get-NetTCPConnection -LocalPort 5173 -State Listen | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force }
            if (-not $Dev.WaitForExit(60000)) { $Dev.Kill(); throw "dev did not end with Vite in $Edition" }
          }
          foreach ($edition in 'powershell', 'pwsh') {
            Write-Host "== $edition"
            $dev = Start-Dev $edition
            $answer = (Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:5173/__vault/launch).Content | ConvertFrom-Json
            if ($answer.launch -notmatch '\A[A-Za-z0-9_-]{43}\z') { throw "Vite did not answer with a launch id: $($answer.launch)" }
            $health = (Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:5173/api/health).Content | ConvertFrom-Json
            if (($health.launch -notmatch '\A[A-Za-z0-9_-]{43}\z') -or ($health.launch -ceq $answer.launch)) { throw 'the server did not answer with a launch id of its own' }
            Stop-Vite $dev $edition
            if (Test-Path .run\server.json) { throw 'dev left its record behind' }
            if (Test-Answers http://127.0.0.1:8765/api/health) { throw 'dev left its server running' }

            # stop ends dev's server while dev is open, and run starts another one.
            $dev = Start-Dev $edition
            & $edition -NoProfile -File .\vault.ps1 stop
            if ($LASTEXITCODE -ne 0) { throw "stop failed in $edition" }
            & $edition -NoProfile -File .\vault.ps1 run -NoBrowser
            if ($LASTEXITCODE -ne 0) { throw "run failed in $edition" }
            Stop-Vite $dev $edition
            if (-not (Test-Path .run\server.json)) { throw 'dev removed the record of the server that run started' }
            if (-not (Test-Answers http://127.0.0.1:8765/api/health)) { throw 'the server that run started is gone' }
            & $edition -NoProfile -File .\vault.ps1 stop
            if ($LASTEXITCODE -ne 0) { throw "stop failed in $edition" }
            if (Test-Answers http://127.0.0.1:8765/api/health) { throw 'stop did not find the server that run started' }
          }
      - name: A settings file without a vault folder is refused
        shell: pwsh
        run: |
          $env:AIVAULT_CONFIG = Join-Path $env:RUNNER_TEMP 'no-vault.toml'
          $text = & powershell -NoProfile -File .\vault.ps1 run -NoBrowser 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'run started without a vault folder' }
          if ($text -notmatch 'no vault folder is set') { throw "unexpected message: $text" }
          if (Test-Path .run\server.json) { throw 'a server was started anyway' }
          # The refused run left exit code 1 behind, and the step would report it.
          exit 0
