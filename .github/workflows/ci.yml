name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.8.17
  PIP_AUDIT_VERSION: 2.10.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  repo-safety:
    name: Repository safety (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Safety check on tracked files and full history
        run: python scripts/check_repo_safety.py --history
      - name: ADR structure check
        run: python scripts/check_adrs.py
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--all"
      - name: Hygiene hooks
        env:
          SKIP: gitleaks
        run: |
          python -m pip install pre-commit==4.6.2
          pre-commit run --all-files --show-diff-on-failure

  repo-safety-windows:
    name: Repository safety (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check_repo_safety.py --history

  backend:
    name: Backend (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Install from the lock file
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Licence check (development tools included, reviewed exceptions allowed)
        run: uv run python ../scripts/check_python_licenses.py --ignore vault
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file ../runtime.txt
          uv export --locked --only-dev --no-hashes --output-file ../dev.txt
          pip-audit --requirement ../runtime.txt --no-deps --disable-pip --strict
          pip-audit --requirement ../dev.txt --no-deps --disable-pip --strict
      - name: Licence check (runtime only, no exceptions)
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python ../scripts/check_python_licenses.py --strict --ignore vault

  backend-windows:
    name: Backend (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==$env:UV_VERSION"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  demo-corpus:
    name: Demo corpus (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: Install from the lock file
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Validation tests (every cited document, page and quote exists)
        run: uv run python -m unittest discover -s tests -v
      - name: Committed corpus and eval set match the generator
        run: uv run python build.py --check
      - name: Licence check (generator tools, reviewed exceptions allowed)
        run: uv run python ../../scripts/check_python_licenses.py --ignore demo-generate
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file ../../runtime.txt
          uv export --locked --only-dev --no-hashes --output-file ../../dev.txt
          pip-audit --requirement ../../runtime.txt --no-deps --disable-pip --strict
          pip-audit --requirement ../../dev.txt --no-deps --disable-pip --strict

  demo-corpus-windows:
    name: Demo corpus (Windows)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: demo/generate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==$env:UV_VERSION"
      - run: uv sync --locked
      # Byte-for-byte comparison with the committed files is Linux-only (libraries can differ in
      # their compression); here the tests check that the corpus is valid and deterministic.
      - run: uv run python -m unittest discover -s tests -v
