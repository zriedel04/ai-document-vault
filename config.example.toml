# Copy to config.toml (git-ignored) and adjust. Never put API keys in this file.
# Later sections arrive with their phases.

[vault]
# An absolute folder outside every Git repository (the app refuses to start otherwise).
# The database, the documents and the API token (the file local-token) live here.
path = 'D:\AIVault'

[server]
host = "127.0.0.1"
port = 8765

[frontend]
# The built frontend (npm run build in frontend/). Defaults to frontend/dist in this repository.
# dist = 'C:\path\to\frontend\dist'

[processing]
# The code page of old TXT and Markdown files that are not UTF-8 (Notepad's "ANSI"): cp1252 for
# English and Western European, cp1250 Central European, cp1251 Cyrillic, cp1253 Greek, cp932
# Japanese, and the other Windows code pages listed in the error if you mistype one.
text_fallback_encoding = "cp1252"
# Heavy parsing runs in a child process: it is killed after this many seconds (1 to 3600) and
# its memory is capped at this many MiB (256 to 65536).
sandbox_timeout_seconds = 300
sandbox_memory_mib = 2048

[workers]
# How many jobs of each processing stage may run at once (1 to 16).
extract = 2
ocr = 1
metadata = 1
chunk = 1
embed = 1
enrich = 2

[retrieval]
# Hybrid search (plan section 8). Not used yet: search is keyword only until vectors exist.
# Whole numbers only (no quotes, no decimal point).
# How many hits of keyword search and of vector search are fused (1 to 500 each).
keyword_candidates = 50
vector_candidates = 50
# Reciprocal Rank Fusion: a chunk scores 1 / (rrf_k + rank) in each list it is in (0 to 1000).
rrf_k = 60
# At most this many chunks of one document in the results (1 to 100).
max_chunks_per_document = 3

# Model routing (plan section 9): features ask for a task, and these tables say which provider and
# model serve it. Not used yet: nothing calls a model until Ask the Vault (Phase 5).
# - Task names: answer, answer_deep, classify, query_rewrite. Any other name stops start-up.
# - provider: "anthropic", "openai" or "fake" (offline, for tests and the demo). Only "fake" can
#   be used until the Anthropic and OpenAI adapters exist.
# - model: the provider's model id, written exactly as the provider spells it.
# - batch: true or false (default false): the task may use the provider's batch API.
# A table names both provider and model; a task left out keeps the route below. The Ask screen's
# provider and model picker overrides the route for one question. API keys never go here.
[ai.routes.answer]        # Ask the Vault default
provider = "anthropic"
model = "claude-sonnet-5-5"

[ai.routes.answer_deep]   # "Deep answer" toggle: cross-document synthesis
provider = "anthropic"
model = "claude-opus-5-5"

[ai.routes.classify]      # metadata and summary suggestions
provider = "anthropic"
model = "claude-haiku-4-5"
batch = true

# Later (query rewriting); no route by default, so the task cannot run until one is set.
# [ai.routes.query_rewrite]
# provider = "openai"
# model = "gpt-5.6-luna"

[logging]
level = "INFO"
