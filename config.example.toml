# Copy to config.toml (git-ignored) and adjust. Never put API keys in this file.
# Later sections (ai) arrive with their phases.

[vault]
# An absolute folder outside every Git repository (the app refuses to start otherwise).
# The database, the documents and the API token (the file local-token) live here.
path = 'D:\AIVault'

[server]
host = "127.0.0.1"
port = 8765

[frontend]
# The built frontend (npm run build in frontend/). Defaults to frontend/dist in this repository.
# dist = 'C:\path\to\frontend\dist'

[processing]
# The code page of old TXT and Markdown files that are not UTF-8 (Notepad's "ANSI"): cp1252 for
# English and Western European, cp1250 Central European, cp1251 Cyrillic, cp1253 Greek, cp932
# Japanese, and the other Windows code pages listed in the error if you mistype one.
text_fallback_encoding = "cp1252"
# Heavy parsing runs in a child process: it is killed after this many seconds (1 to 3600) and
# its memory is capped at this many MiB (256 to 65536).
sandbox_timeout_seconds = 300
sandbox_memory_mib = 2048

[workers]
# How many jobs of each processing stage may run at once (1 to 16).
extract = 2
ocr = 1
metadata = 1
chunk = 1
embed = 1
enrich = 2

[retrieval]
# Hybrid search (plan section 8). Not used yet: search is keyword only until vectors exist.
# Whole numbers only (no quotes, no decimal point).
# How many hits of keyword search and of vector search are fused (1 to 500 each).
keyword_candidates = 50
vector_candidates = 50
# Reciprocal Rank Fusion: a chunk scores 1 / (rrf_k + rank) in each list it is in (0 to 1000).
rrf_k = 60
# At most this many chunks of one document in the results (1 to 100).
max_chunks_per_document = 3
# Context packing for Ask the Vault: at most this many tokens of sources go to the answer model,
# counted with a conservative estimate (1,000 to 200,000).
context_budget_tokens = 8000
# Chunks before and after each source added for context when the budget allows (0 to 3).
context_neighbor_chunks = 1

[pricing]
# What each model costs, for the cost estimate of every AI call in the usage ledger (the AI
# features that make calls are not built yet). One table per provider (anthropic, openai) and
# model id; a model id with a dot needs quotes. Each price is US dollars per million tokens, a
# number (not text) from 0 to 1000 with at most six decimal places: input is normal input tokens,
# cached_input is input read from the provider's prompt cache, output is output tokens. All three
# are required. A model with no table here has its cost recorded as unknown, never as zero.
# Prices change: copy them from each provider's price page and keep them current. The figures
# below are the plan's October 2026 input and output prices; the cached_input figures are
# placeholders (a tenth of input) to replace with the provider's own. They are commented out so
# that no stale price is used by accident.
# [pricing.anthropic.claude-haiku-4-5]
# input = 1
# cached_input = 0.1
# output = 5
# [pricing.anthropic.claude-sonnet-5-5]
# input = 2
# cached_input = 0.2
# output = 10
# [pricing.anthropic.claude-opus-5-5]
# input = 4
# cached_input = 0.4
# output = 20
# [pricing.openai."gpt-5.6-luna"]
# input = 0.20
# cached_input = 0.02
# output = 1.20

[logging]
level = "INFO"
