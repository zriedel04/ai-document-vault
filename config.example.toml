# Copy to config.toml (git-ignored) and adjust. Never put API keys in this file.
# Later sections (processing, ai, pricing) arrive with their phases.

[vault]
# An absolute folder outside every Git repository (the app refuses to start otherwise).
# The database, the documents and the API token (the file local-token) live here.
path = 'D:\AIVault'

[server]
host = "127.0.0.1"
port = 8765

[logging]
level = "INFO"
